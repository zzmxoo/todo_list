[package]
name = "desktop-todo"
version = "0.0.10"
description = "桌面待办小工具"
authors = ["Todo Widget"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["time", "process", "net"] }

[features]
# 仅测试构建启用：允许 DESKTOP_TODO_DATA_DIR 把数据目录指向临时目录。
test-data-dir = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
