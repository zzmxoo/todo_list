name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 生成变更说明
        id: changelog
        shell: pwsh
        run: ./.github/scripts/changelog.ps1 -Tag "$env:GITHUB_REF_NAME"

      # 仓库里的 cargo 镜像指向 rsproxy.cn，美国 runner 访问很慢
      - name: 移除国内镜像
        shell: pwsh
        run: Remove-Item src-tauri/.cargo/config.toml -Force

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装 Tauri CLI
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'tauri-cli'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'cargo-tauri.zip'
          Invoke-WebRequest -Uri 'https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.6/cargo-tauri-x86_64-pc-windows-msvc.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $dest | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 备份守卫自测
        shell: pwsh
        run: ./tests/test-regress-lib.ps1

      - name: 单元测试
        shell: pwsh
        working-directory: src-tauri
        run: |
          $out = cargo test --release 2>&1
          $code = $LASTEXITCODE
          $out | Write-Host
          $text = $out -join "`n"
          $matches = [regex]::Matches($text, 'test result: [^.]+\. (\d+) passed')
          $n = ($matches | ForEach-Object { [int]$_.Groups[1].Value } | Measure-Object -Sum).Sum
          if ($code -ne 0) {
            Write-Host "::error::cargo test exit $code"
            exit 1
          }
          if ($n -lt 42) {
            Write-Host "::error::Rust 单测只有 $n 条，expected at least 42"
            exit 1
          }

      # 完整 UI 回归依赖真实 WebView2 窗口与 CDP，打 tag 前在本地跑：
      #   powershell -ExecutionPolicy Bypass -File tests\regression.ps1

      - name: 打包并发布
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: cargo tauri
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: 桌面待办 ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          uploadPlainBinary: true
          releaseAssetNamePattern: '[mainBinaryName]_[version][setup].[ext]'

      # MSIX 供 Microsoft Store 上架；Tauri 没有 msix 目标，用 makeappx 手工打包。
      # 必须放在 draft Release 生成之后：这里才能保证 release exe 已由 tauri-action 构建。
      # 身份参数从仓库 Variables 读取（Settings → Secrets and variables → Actions → Variables）：
      #   MSIX_IDENTITY_NAME / MSIX_PUBLISHER / MSIX_PUBLISHER_DISPLAY_NAME
      # 未配置时跳过，避免产出无法上架的占位包。
      - name: 生成 MSIX 包
        id: msix
        shell: pwsh
        run: |
          $id  = '${{ vars.MSIX_IDENTITY_NAME }}'
          $pub = '${{ vars.MSIX_PUBLISHER }}'
          $pd  = '${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}'
          if (-not $id -or -not $pub) {
            Write-Host "::warning::未配置 MSIX_IDENTITY_NAME / MSIX_PUBLISHER，跳过 MSIX 打包"
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          ./tests/build-msix.ps1 -IdentityName $id -Publisher $pub -PublisherDisplayName $pd
          $msix = Get-ChildItem src-tauri/target/msix/*.msix | Select-Object -First 1
          "path=$($msix.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 上传 MSIX 到 Release
        if: steps.msix.outputs.skip != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSIX_PATH: ${{ steps.msix.outputs.path }}
        run: |
          gh release upload $env:GITHUB_REF_NAME $env:MSIX_PATH --clobber

      # 所有资产上传成功后再公开；中途失败时 Release 保持草稿，可直接重跑同一 tag。
      - name: 公开 Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit $env:GITHUB_REF_NAME --draft=false
