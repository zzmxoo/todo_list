name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 生成变更说明
        id: changelog
        shell: pwsh
        run: ./.github/scripts/changelog.ps1 -Tag "$env:GITHUB_REF_NAME"

      # 仓库里的 cargo 镜像指向 rsproxy.cn，美国 runner 访问很慢
      - name: 移除国内镜像
        shell: pwsh
        run: Remove-Item src-tauri/.cargo/config.toml -Force

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装 Tauri CLI
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'tauri-cli'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'cargo-tauri.zip'
          Invoke-WebRequest -Uri 'https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.6/cargo-tauri-x86_64-pc-windows-msvc.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $dest | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 备份守卫自测
        shell: pwsh
        run: ./tests/test-regress-lib.ps1

      - name: 检查隐私政策占位符
        shell: pwsh
        run: |
          $bad = Select-String -Path docs/PRIVACY.md -Pattern '\[(运营者名称|联系邮箱|生效日期)\]'
          if ($bad) {
            $bad | ForEach-Object { Write-Host "::error::隐私政策仍有占位符：$($_.Line)" }
            exit 1
          }

      - name: 单元测试
        shell: pwsh
        working-directory: src-tauri
        run: |
          . ../tests/regress-lib.ps1
          $out = cargo test --release 2>&1
          $code = $LASTEXITCODE
          $out | Write-Host
          $text = $out -join "`n"
          $matches = [regex]::Matches($text, 'test result: [^.]+\. (\d+) passed')
          $n = ($matches | ForEach-Object { [int]$_.Groups[1].Value } | Measure-Object -Sum).Sum
          if ($code -ne 0) {
            Write-Host "::error::cargo test exit $code"
            exit 1
          }
          if ($n -lt $MIN_RUST_CASES) {
            Write-Host "::error::Rust 单测只有 $n 条，expected at least $MIN_RUST_CASES"
            exit 1
          }

      # 完整 UI 回归依赖真实 WebView2 窗口与 CDP，打 tag 前在本地跑：
      #   powershell -ExecutionPolicy Bypass -File tests\regression.ps1

      - name: 打包并发布
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: cargo tauri
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: Tiny·待办事项 ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          uploadPlainBinary: true
          releaseAssetNamePattern: '[mainBinaryName]_[version][setup].[ext]'

      # 发布只提供 exe 安装包/便携版；源码由 GitHub 在 Release 里自动附带。
      # MSIX 仅供 Microsoft Store 提交，不随 GitHub Release 发布（需要时本地手动打包）。

      # 所有资产上传成功后再公开；中途失败时 Release 保持草稿，可直接重跑同一 tag。
      - name: 校验发布资产
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $required = @("desktop-todo_$version-setup.exe", "desktop-todo_$version.exe")
          $release = gh release view $env:GITHUB_REF_NAME --json assets | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in $required) {
            if ($names -notcontains $name) {
              Write-Host "::error::Release 缺少资产 $name"
              exit 1
            }
          }

      - name: 公开 Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit $env:GITHUB_REF_NAME --draft=false
